<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ROS Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #007AFF;
            --primary-dark: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #1a1a2e;
            --darker: #0f0f1a;
            --card: #252540;
            --card-hover: #2d2d4a;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #3a3a5a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--darker);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--card);
            border-radius: 20px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Connection Bar */
        .connection-bar {
            background: var(--darker);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }

        .input-field {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--card-hover);
        }

        /* Main Layout - 2 Column */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 110px);
        }

        @media (max-width: 1000px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Panel - Camera & LiDAR */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Right Panel - Controls */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Card */
        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 12px 16px;
            background: var(--darker);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .card-body {
            padding: 16px;
        }

        /* Camera */
        .camera-container {
            flex: 1;
            min-height: 300px;
        }

        .video-wrapper {
            background: #000;
            border-radius: 8px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .video-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            color: var(--text-muted);
            text-align: center;
        }

        .video-placeholder svg {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .camera-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .camera-controls input {
            flex: 1;
        }

        .video-stats {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--success);
        }

        /* LiDAR */
        .lidar-container {
            height: 250px;
        }

        .lidar-wrapper {
            background: #000;
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lidarCanvas {
            max-width: 100%;
            max-height: 100%;
        }

        .lidar-stats {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .lidar-stats span {
            color: var(--primary);
        }

        /* Joystick */
        .joystick-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .joystick-area {
            position: relative;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, var(--card-hover) 0%, var(--darker) 100%);
            border-radius: 50%;
            border: 2px solid var(--border);
            touch-action: none;
            cursor: crosshair;
        }

        .joystick-stick {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            pointer-events: none;
            transition: box-shadow 0.2s;
        }

        .joystick-stick.active {
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.6);
        }

        .joystick-center {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--border);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Velocity Display */
        .velocity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
        }

        .velocity-box {
            background: var(--darker);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .velocity-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .velocity-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .velocity-unit {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Motor Speed */
        .motor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .motor-box {
            background: var(--darker);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .motor-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .motor-bar {
            height: 8px;
            background: var(--card);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .motor-fill {
            height: 100%;
            background: var(--success);
            border-radius: 4px;
            transition: width 0.1s, background 0.2s;
        }

        .motor-fill.reverse {
            background: var(--warning);
        }

        .motor-value {
            font-size: 12px;
            color: var(--text);
            font-weight: 500;
        }

        /* Speed Sliders */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .slider-label {
            width: 80px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .slider-input {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: var(--darker);
            border-radius: 3px;
            outline: none;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            width: 45px;
            text-align: right;
            font-size: 13px;
            color: var(--primary);
            font-weight: 500;
        }

        /* D-Pad */
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }

        .dpad-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--darker);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .dpad-btn:hover {
            background: var(--card-hover);
            border-color: var(--primary);
        }

        .dpad-btn:active, .dpad-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            transform: scale(0.95);
        }

        .dpad-btn.stop {
            background: var(--danger);
            border-color: var(--danger);
            font-size: 12px;
            font-weight: 600;
        }

        .dpad-btn.stop:hover {
            background: #c82333;
        }

        .dpad-btn.empty {
            visibility: hidden;
        }

        /* Keyboard hints */
        .keyboard-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }

        kbd {
            display: inline-block;
            padding: 2px 6px;
            background: var(--darker);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 10px;
            margin: 0 2px;
        }

        /* Topics Panel */
        .topics-toggle {
            cursor: pointer;
        }

        .topics-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .topic-chip {
            padding: 4px 10px;
            background: var(--darker);
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .topic-chip:hover {
            background: var(--primary);
            color: white;
        }

        .topic-chip.image {
            border-left: 2px solid var(--warning);
        }

        .topic-chip.laser {
            border-left: 2px solid var(--primary);
        }

        /* Responsive Mobile */
        @media (max-width: 600px) {
            .main-container {
                padding: 10px;
                gap: 10px;
            }

            .connection-bar {
                padding: 8px 10px;
            }

            .joystick-area {
                width: 160px;
                height: 160px;
            }

            .joystick-stick {
                width: 50px;
                height: 50px;
            }

            .dpad-grid {
                grid-template-columns: repeat(3, 45px);
            }

            .dpad-btn {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>ROS Controller</h1>
        <div class="header-right">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <!-- Connection Bar -->
    <div class="connection-bar">
        <input type="text" class="input-field" id="robotIP" placeholder="Robot IP" style="width:150px">
        <input type="number" class="input-field" id="robotPort" value="9090" style="width:70px">
        <button class="btn btn-primary" id="connectBtn" onclick="toggleConnection()">Connect</button>
        <button class="btn btn-secondary" onclick="refreshTopics()">Refresh Topics</button>
    </div>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <!-- Camera -->
            <div class="card camera-container">
                <div class="card-header">
                    Camera
                    <span id="cameraFps" style="color:var(--success);font-size:12px">-- fps</span>
                </div>
                <div class="card-body">
                    <div class="video-wrapper">
                        <div class="video-placeholder" id="cameraPlaceholder">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                            </svg>
                            <div>No camera feed</div>
                        </div>
                        <img id="cameraImage" style="display:none" alt="Camera">
                    </div>
                    <div class="camera-controls">
                        <input type="text" class="input-field" id="cameraTopic" placeholder="/camera/image/compressed">
                        <button class="btn btn-primary" id="cameraBtn" onclick="toggleCamera()">Start</button>
                    </div>
                </div>
            </div>

            <!-- LiDAR -->
            <div class="card lidar-container">
                <div class="card-header">
                    LiDAR
                    <span id="lidarFps" style="color:var(--success);font-size:12px">-- fps</span>
                </div>
                <div class="card-body">
                    <div class="lidar-wrapper">
                        <canvas id="lidarCanvas" width="180" height="180"></canvas>
                    </div>
                    <div class="lidar-stats">
                        Points: <span id="lidarPoints">0</span> |
                        Range: <span id="lidarRange">0-0</span>m
                    </div>
                    <div class="camera-controls">
                        <input type="text" class="input-field" id="lidarTopic" value="/scan" placeholder="/scan">
                        <button class="btn btn-primary" id="lidarBtn" onclick="toggleLidar()">Start</button>
                    </div>
                </div>
            </div>

            <!-- Topics -->
            <div class="card">
                <div class="card-header topics-toggle">Topics</div>
                <div class="card-body">
                    <div class="topics-list" id="topicList">
                        <div class="topic-chip">Connect first</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Controls -->
        <div class="right-panel">
            <!-- Joystick -->
            <div class="card">
                <div class="card-header">Control</div>
                <div class="card-body">
                    <div class="joystick-wrapper">
                        <div class="joystick-area" id="joystickArea">
                            <div class="joystick-center"></div>
                            <div class="joystick-stick" id="joystickStick"></div>
                        </div>

                        <div class="velocity-grid">
                            <div class="velocity-box">
                                <div class="velocity-label">Linear</div>
                                <div class="velocity-value" id="linearVel">0.00</div>
                                <div class="velocity-unit">m/s</div>
                            </div>
                            <div class="velocity-box">
                                <div class="velocity-label">Angular</div>
                                <div class="velocity-value" id="angularVel">0.00</div>
                                <div class="velocity-unit">rad/s</div>
                            </div>
                        </div>

                        <div class="motor-grid">
                            <div class="motor-box">
                                <div class="motor-label">Left Motor</div>
                                <div class="motor-bar"><div class="motor-fill" id="motorLeft"></div></div>
                                <div class="motor-value" id="motorLeftVal">0%</div>
                            </div>
                            <div class="motor-box">
                                <div class="motor-label">Right Motor</div>
                                <div class="motor-bar"><div class="motor-fill" id="motorRight"></div></div>
                                <div class="motor-value" id="motorRightVal">0%</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Speed Settings -->
            <div class="card">
                <div class="card-header">Speed Settings</div>
                <div class="card-body">
                    <div class="slider-row">
                        <span class="slider-label">Max Linear</span>
                        <input type="range" class="slider-input" id="maxLinear" min="0.1" max="2.0" step="0.1" value="0.5">
                        <span class="slider-value" id="maxLinearVal">0.5</span>
                    </div>
                    <div class="slider-row">
                        <span class="slider-label">Max Angular</span>
                        <input type="range" class="slider-input" id="maxAngular" min="0.1" max="3.0" step="0.1" value="1.0">
                        <span class="slider-value" id="maxAngularVal">1.0</span>
                    </div>
                </div>
            </div>

            <!-- D-Pad -->
            <div class="card">
                <div class="card-header">Quick Control</div>
                <div class="card-body">
                    <div class="dpad-grid">
                        <button class="dpad-btn" data-cmd="rotateLeft">&#8634;</button>
                        <button class="dpad-btn" data-cmd="forward">&#9650;</button>
                        <button class="dpad-btn" data-cmd="rotateRight">&#8635;</button>
                        <button class="dpad-btn" data-cmd="left">&#9664;</button>
                        <button class="dpad-btn stop" onclick="stopRobot()">STOP</button>
                        <button class="dpad-btn" data-cmd="right">&#9654;</button>
                        <button class="dpad-btn empty"></button>
                        <button class="dpad-btn" data-cmd="backward">&#9660;</button>
                        <button class="dpad-btn empty"></button>
                    </div>
                    <div class="keyboard-hint">
                        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or Arrows | <kbd>Space</kbd> Stop
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ROSLIB -->
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>

    <script>
    (function() {
        'use strict';

        // State
        let ros = null;
        let cmdVelPub = null;
        let cameraSub = null;
        let lidarSub = null;
        let connected = false;

        // Joystick
        let isDragging = false;
        let stickX = 0, stickY = 0;

        // Settings
        let maxLinear = 0.5;
        let maxAngular = 1.0;

        // FPS
        let cameraFrames = 0, lidarFrames = 0;

        // Rate limit
        let lastCmdTime = 0;
        const CMD_RATE = 50;

        // DOM
        const $ = id => document.getElementById(id);
        const els = {
            statusDot: $('statusDot'),
            statusText: $('statusText'),
            connectBtn: $('connectBtn'),
            robotIP: $('robotIP'),
            robotPort: $('robotPort'),
            joystickArea: $('joystickArea'),
            joystickStick: $('joystickStick'),
            linearVel: $('linearVel'),
            angularVel: $('angularVel'),
            motorLeft: $('motorLeft'),
            motorRight: $('motorRight'),
            motorLeftVal: $('motorLeftVal'),
            motorRightVal: $('motorRightVal'),
            maxLinearSlider: $('maxLinear'),
            maxAngularSlider: $('maxAngular'),
            maxLinearVal: $('maxLinearVal'),
            maxAngularVal: $('maxAngularVal'),
            cameraImage: $('cameraImage'),
            cameraPlaceholder: $('cameraPlaceholder'),
            cameraTopic: $('cameraTopic'),
            cameraBtn: $('cameraBtn'),
            cameraFps: $('cameraFps'),
            lidarCanvas: $('lidarCanvas'),
            lidarTopic: $('lidarTopic'),
            lidarBtn: $('lidarBtn'),
            lidarFps: $('lidarFps'),
            lidarPoints: $('lidarPoints'),
            lidarRange: $('lidarRange'),
            topicList: $('topicList')
        };

        const lidarCtx = els.lidarCanvas.getContext('2d');

        // Init
        function init() {
            initJoystick();
            initSliders();
            initDpad();
            initKeyboard();
            drawLidarBg();
            initFps();
            autoDetect();

            const saved = localStorage.getItem('robotIP');
            if (saved) els.robotIP.value = saved;
        }

        function autoDetect() {
            const host = window.location.hostname;
            if (host && host !== 'localhost' && host !== '127.0.0.1' && !host.includes('github')) {
                els.robotIP.value = host;
                setTimeout(connect, 500);
            }
        }

        // Connection
        window.toggleConnection = function() {
            connected ? disconnect() : connect();
        };

        function connect() {
            const ip = els.robotIP.value.trim() || window.location.hostname || 'localhost';
            const port = els.robotPort.value || '9090';
            localStorage.setItem('robotIP', ip);

            try {
                ros = new ROSLIB.Ros({ url: `ws://${ip}:${port}` });

                ros.on('connection', () => {
                    connected = true;
                    updateStatus(true);
                    setupCmdVel();
                    refreshTopics();
                });

                ros.on('error', e => console.error('ROS Error:', e));
                ros.on('close', () => { connected = false; updateStatus(false); });
            } catch(e) {
                console.error('Connect failed:', e);
            }
        }

        function disconnect() {
            if (cameraSub) { cameraSub.unsubscribe(); cameraSub = null; }
            if (lidarSub) { lidarSub.unsubscribe(); lidarSub = null; }
            if (ros) { ros.close(); ros = null; }
            connected = false;
            updateStatus(false);
        }

        function updateStatus(on) {
            els.statusDot.classList.toggle('connected', on);
            els.statusText.textContent = on ? 'Connected' : 'Disconnected';
            els.connectBtn.textContent = on ? 'Disconnect' : 'Connect';
            els.connectBtn.className = on ? 'btn btn-danger' : 'btn btn-primary';
        }

        // cmd_vel
        function setupCmdVel() {
            cmdVelPub = new ROSLIB.Topic({
                ros,
                name: '/cmd_vel',
                messageType: 'geometry_msgs/Twist'
            });
        }

        function sendVelocity(linear, angular) {
            if (!connected || !cmdVelPub) return;

            const now = Date.now();
            if (now - lastCmdTime < CMD_RATE) return;
            lastCmdTime = now;

            cmdVelPub.publish(new ROSLIB.Message({
                linear: { x: linear, y: 0, z: 0 },
                angular: { x: 0, y: 0, z: angular }
            }));

            // Update display
            els.linearVel.textContent = linear.toFixed(2);
            els.angularVel.textContent = angular.toFixed(2);

            // Motor speed estimate (differential drive)
            const wheelBase = 0.14; // meters
            const leftSpeed = linear - (angular * wheelBase / 2);
            const rightSpeed = linear + (angular * wheelBase / 2);

            updateMotor('Left', leftSpeed);
            updateMotor('Right', rightSpeed);
        }

        function updateMotor(side, speed) {
            const maxSpeed = maxLinear * 1.5;
            const pct = Math.min(Math.abs(speed) / maxSpeed * 100, 100);
            const fill = els['motor' + side];
            const val = els['motor' + side + 'Val'];

            fill.style.width = pct + '%';
            fill.classList.toggle('reverse', speed < 0);
            val.textContent = (speed < 0 ? '-' : '') + Math.round(pct) + '%';
        }

        window.stopRobot = function() {
            lastCmdTime = 0;
            sendVelocity(0, 0);
            resetJoystick();
        };

        function sendQuickCmd(cmd) {
            const l = maxLinear, a = maxAngular;
            switch(cmd) {
                case 'forward': sendVelocity(l, 0); break;
                case 'backward': sendVelocity(-l, 0); break;
                case 'left': sendVelocity(l*0.5, a); break;
                case 'right': sendVelocity(l*0.5, -a); break;
                case 'rotateLeft': sendVelocity(0, a); break;
                case 'rotateRight': sendVelocity(0, -a); break;
            }
        }

        // Joystick
        function initJoystick() {
            const area = els.joystickArea;
            const stick = els.joystickStick;

            function getPos(e) {
                const rect = area.getBoundingClientRect();
                const cx = rect.width / 2;
                const cy = rect.height / 2;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left - cx,
                    y: clientY - rect.top - cy,
                    cx, cy,
                    maxR: cx - 30
                };
            }

            function updateStick(x, y, maxR) {
                const dist = Math.sqrt(x*x + y*y);
                if (dist > maxR) {
                    x = x / dist * maxR;
                    y = y / dist * maxR;
                }
                stickX = x;
                stickY = y;

                stick.style.left = `calc(50% + ${x}px)`;
                stick.style.top = `calc(50% + ${y}px)`;
                stick.style.transform = 'translate(-50%, -50%)';

                const linear = -y / maxR * maxLinear;
                const angular = -x / maxR * maxAngular;
                sendVelocity(linear, angular);
            }

            function startDrag(e) {
                isDragging = true;
                stick.classList.add('active');
                const pos = getPos(e);
                updateStick(pos.x, pos.y, pos.maxR);
                e.preventDefault();
            }

            function moveDrag(e) {
                if (!isDragging) return;
                const pos = getPos(e);
                updateStick(pos.x, pos.y, pos.maxR);
                e.preventDefault();
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                stick.classList.remove('active');
                resetJoystick();
                stopRobot();
            }

            // Events on area (not just stick)
            area.addEventListener('mousedown', startDrag);
            area.addEventListener('touchstart', startDrag, { passive: false });

            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('touchmove', moveDrag, { passive: false });

            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
            document.addEventListener('touchcancel', endDrag);
        }

        function resetJoystick() {
            stickX = 0;
            stickY = 0;
            els.joystickStick.style.left = '50%';
            els.joystickStick.style.top = '50%';
            els.joystickStick.style.transform = 'translate(-50%, -50%)';
        }

        // Sliders
        function initSliders() {
            els.maxLinearSlider.oninput = e => {
                maxLinear = parseFloat(e.target.value);
                els.maxLinearVal.textContent = maxLinear.toFixed(1);
            };
            els.maxAngularSlider.oninput = e => {
                maxAngular = parseFloat(e.target.value);
                els.maxAngularVal.textContent = maxAngular.toFixed(1);
            };
        }

        // D-Pad
        function initDpad() {
            document.querySelectorAll('.dpad-btn[data-cmd]').forEach(btn => {
                const cmd = btn.dataset.cmd;

                const start = e => {
                    e.preventDefault();
                    btn.classList.add('active');
                    sendQuickCmd(cmd);
                };
                const end = e => {
                    if (e) e.preventDefault();
                    btn.classList.remove('active');
                    stopRobot();
                };

                btn.addEventListener('mousedown', start);
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end);
                btn.addEventListener('touchcancel', end);
            });

            document.addEventListener('mouseup', () => {
                document.querySelectorAll('.dpad-btn.active').forEach(b => {
                    b.classList.remove('active');
                });
            });
        }

        // Keyboard
        function initKeyboard() {
            const keys = {};

            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'INPUT') return;
                keys[e.code] = true;
                updateKeys(keys);
                if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            });

            document.addEventListener('keyup', e => {
                keys[e.code] = false;
                updateKeys(keys);
            });

            window.addEventListener('blur', () => {
                Object.keys(keys).forEach(k => keys[k] = false);
                stopRobot();
            });
        }

        function updateKeys(k) {
            let l = 0, a = 0;
            if (k.KeyW || k.ArrowUp) l += maxLinear;
            if (k.KeyS || k.ArrowDown) l -= maxLinear;
            if (k.KeyA || k.ArrowLeft) a += maxAngular;
            if (k.KeyD || k.ArrowRight) a -= maxAngular;
            if (k.Space) { l = 0; a = 0; }
            sendVelocity(l, a);
        }

        // Camera
        window.toggleCamera = function() {
            if (cameraSub) {
                cameraSub.unsubscribe();
                cameraSub = null;
                els.cameraImage.style.display = 'none';
                els.cameraPlaceholder.style.display = 'flex';
                els.cameraBtn.textContent = 'Start';
                return;
            }

            if (!connected) return;
            const topic = els.cameraTopic.value.trim();
            if (!topic) return;

            const isCompressed = topic.includes('compressed');
            cameraSub = new ROSLIB.Topic({
                ros,
                name: topic,
                messageType: isCompressed ? 'sensor_msgs/CompressedImage' : 'sensor_msgs/Image',
                throttle_rate: 33
            });

            cameraSub.subscribe(msg => {
                cameraFrames++;
                els.cameraPlaceholder.style.display = 'none';
                els.cameraImage.style.display = 'block';
                els.cameraImage.src = `data:image/${msg.format || 'jpeg'};base64,${msg.data}`;
            });

            els.cameraBtn.textContent = 'Stop';
        };

        // LiDAR
        function drawLidarBg() {
            const w = els.lidarCanvas.width;
            const h = els.lidarCanvas.height;
            const cx = w/2, cy = h/2;
            const r = Math.min(cx, cy) - 5;

            lidarCtx.fillStyle = '#000';
            lidarCtx.fillRect(0, 0, w, h);

            lidarCtx.strokeStyle = '#1a3a1a';
            lidarCtx.lineWidth = 1;
            for (let i = 1; i <= 3; i++) {
                lidarCtx.beginPath();
                lidarCtx.arc(cx, cy, r/3*i, 0, Math.PI*2);
                lidarCtx.stroke();
            }

            lidarCtx.beginPath();
            lidarCtx.moveTo(cx, 5); lidarCtx.lineTo(cx, h-5);
            lidarCtx.moveTo(5, cy); lidarCtx.lineTo(w-5, cy);
            lidarCtx.stroke();

            lidarCtx.fillStyle = '#007AFF';
            lidarCtx.beginPath();
            lidarCtx.arc(cx, cy, 4, 0, Math.PI*2);
            lidarCtx.fill();

            lidarCtx.fillStyle = '#5AC8FA';
            lidarCtx.beginPath();
            lidarCtx.moveTo(cx, cy-12);
            lidarCtx.lineTo(cx-4, cy-6);
            lidarCtx.lineTo(cx+4, cy-6);
            lidarCtx.fill();
        }

        window.toggleLidar = function() {
            if (lidarSub) {
                lidarSub.unsubscribe();
                lidarSub = null;
                drawLidarBg();
                els.lidarBtn.textContent = 'Start';
                return;
            }

            if (!connected) return;
            const topic = els.lidarTopic.value.trim();
            if (!topic) return;

            lidarSub = new ROSLIB.Topic({
                ros,
                name: topic,
                messageType: 'sensor_msgs/LaserScan',
                throttle_rate: 50
            });

            lidarSub.subscribe(scan => {
                lidarFrames++;
                drawLidarScan(scan);
            });

            els.lidarBtn.textContent = 'Stop';
        };

        function drawLidarScan(scan) {
            drawLidarBg();

            const w = els.lidarCanvas.width;
            const h = els.lidarCanvas.height;
            const cx = w/2, cy = h/2;
            const maxR = Math.min(cx, cy) - 5;
            const scale = maxR / scan.range_max;

            els.lidarPoints.textContent = scan.ranges.length;
            els.lidarRange.textContent = `${scan.range_min.toFixed(1)}-${scan.range_max.toFixed(1)}`;

            lidarCtx.fillStyle = '#5AC8FA';
            for (let i = 0; i < scan.ranges.length; i++) {
                const r = scan.ranges[i];
                if (r < scan.range_min || r > scan.range_max || !isFinite(r)) continue;
                const angle = scan.angle_min + i * scan.angle_increment;
                const x = cx + r * scale * Math.sin(-angle);
                const y = cy - r * scale * Math.cos(angle);
                lidarCtx.fillRect(x-1, y-1, 2, 2);
            }
        }

        // Topics
        window.refreshTopics = function() {
            if (!connected) return;
            ros.getTopics(result => {
                els.topicList.innerHTML = '';
                result.topics.forEach((topic, i) => {
                    const type = result.types[i];
                    const chip = document.createElement('div');
                    chip.className = 'topic-chip';
                    if (type.includes('Image')) chip.classList.add('image');
                    else if (type.includes('LaserScan')) chip.classList.add('laser');
                    chip.textContent = topic;
                    chip.title = type;
                    chip.onclick = () => {
                        if (type.includes('Image')) els.cameraTopic.value = topic;
                        else if (type.includes('LaserScan')) els.lidarTopic.value = topic;
                    };
                    els.topicList.appendChild(chip);
                });
            });
        };

        // FPS
        function initFps() {
            setInterval(() => {
                els.cameraFps.textContent = cameraFrames + ' fps';
                els.lidarFps.textContent = lidarFrames + ' fps';
                cameraFrames = 0;
                lidarFrames = 0;
            }, 1000);
        }

        // Start
        init();
    })();
    </script>
</body>
</html>
